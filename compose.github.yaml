services:
  workbench:
    environment:
      BOX_BROKER_URL: http://git-broker:3180
      BOX_CAPABILITY_FILE: /home/node/.box-capability/box-capability
    volumes:
      - github-box-capability:/home/node/.box-capability:ro
    networks:
      - default
      - box-broker
    depends_on:
      git-broker:
        condition: service_healthy

  git-broker:
    build:
      context: .
      dockerfile: Dockerfile.git-broker
    init: true
    volumes:
      - github-broker-state:/home/node/.git-broker
      - github-broker-credentials:/home/node/.broker-credentials:ro
      - github-box-capability:/home/node/.box-capability:ro
    networks:
      - box-broker
      - github-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3180/health',{headers:{Host:'git-broker:3180'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3

  broker-provision:
    profiles: [provision]
    build:
      context: .
      dockerfile: Dockerfile.git-broker
    entrypoint: [node, /opt/broker/provision-container.js]
    command: []
    init: true
    stdin_open: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    environment:
      BOX_ID: ${WORKBENCH_BOX_ID:-local}
      GITHUB_APP_ID: ${WORKBENCH_GITHUB_APP_ID:-}
      GITHUB_REPOSITORIES: ${WORKBENCH_GITHUB_REPOSITORIES:-[]}
    volumes:
      - github-broker-credentials:/home/node/.broker-credentials
      - github-box-capability:/home/node/.box-capability

volumes:
  github-broker-state:
  github-broker-credentials:
  github-box-capability:

networks:
  box-broker:
    internal: true
  github-egress:

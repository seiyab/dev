services:
  broker-provision:
    build:
      context: .
      dockerfile: Dockerfile.git-broker
    entrypoint: [node, /opt/broker/provision-container.js]
    command: []
    user: "${WORKBENCH_UID:?Set WORKBENCH_UID to your host user ID}:${WORKBENCH_GID:?Set WORKBENCH_GID to your host group ID}"
    init: true
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    volumes:
      - type: bind
        source: ${WORKBENCH_BROKER_INPUT:?Set WORKBENCH_BROKER_INPUT to your provisioning JSON file}
        target: /input/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKBENCH_GITHUB_APP_KEY:?Set WORKBENCH_GITHUB_APP_KEY to your App private key file}
        target: /input/github-app.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WORKBENCH_BROKER_DIR:?Set WORKBENCH_BROKER_DIR to your private output directory}
        target: /output
        bind:
          create_host_path: false
